<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Script Translator</title>
<style>
:root{--bg:#eef3fa;--surface:#fff;--ink:#14243d;--muted:#5d6e8a;--line:#cdd8e8;--accent:#2f6fd6;--accent-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#16213a;--ink:#e6edf9;--muted:#93a3c0;--line:#2a3a5c;--accent:#6ea6ff;--accent-ink:#0e1626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px;font:inherit;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{padding:9px 16px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.size{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.out{min-height:110px;color:var(--ink);overflow-x:auto}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:30px;padding-bottom:var(--pb)}
.word{display:inline-flex;align-items:flex-end;gap:var(--lg);margin-right:var(--wg)}
.g{display:inline-block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.p{color:var(--muted);font-weight:600;line-height:1}
.ph{color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.kb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;min-height:68px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.kb button:hover{border-color:var(--accent)}
.kb small{color:var(--muted);font-size:.78rem;line-height:1}
.ctl{display:flex;gap:8px;margin-top:10px}
.ctl button{flex:1}
footer{color:var(--muted);font-size:.85rem}
</style></head><body><main>
<h1>Nova Script Translator</h1>
<p class="sub">Type English to see it in Nova script, or tap symbols on the keyboard to get English text.</p>
<section class="card">
 <label for="t">Text</label>
 <textarea id="t" placeholder="Type here, for example: Hello 2026" spellcheck="false"></textarea>
 <div class="row">
  <button class="btn" id="copy">Copy text</button>
  <button class="btn" id="clear">Clear</button>
  <label class="size" for="sz">Size <input type="range" id="sz" min="0.8" max="2" step="0.1" value="1.2"></label>
 </div>
</section>
<section class="card">
 <label>Nova script</label>
 <div class="out" id="out" aria-live="polite"></div>
 <div class="row"><button class="btn main" id="png">Download image</button></div>
</section>
<section class="card">
 <label>Nova keyboard</label>
 <div class="tabs" id="tabs"></div>
 <div class="kb" id="kb"></div>
 <div class="ctl"><button class="btn" id="sp">Space</button><button class="btn" id="nl">New line</button><button class="btn" id="bk">Backspace</button></div>
</section>
<footer>Fan-made tool based on the community Nova script chart from Stella Sora. It is not an official font. The chart has no symbols for punctuation, so punctuation is shown as plain text.</footer>
</main>

const t=document.getElementById("t"),out=document.getElementById("out"),sz=document.getElementById("sz");
const keyOf=c=>/[0-9]/.test(c)?"N"+c:/[A-Z]/.test(c)?"U"+c:/[a-z]/.test(c)?"L"+c:null;
function glyph(k,s){const[w,h,u,d]=G[k];const e=document.createElement("span");e.className="g";e.style.width=w*s+"px";e.style.height=h*s+"px";e.style.marginBottom=(-d*s)+"px";e.style.webkitMaskImage=e.style.maskImage="url("+u+")";e.setAttribute("role","img");return e}
function render(){
 const s=+sz.value;out.innerHTML="";out.style.setProperty("--lg",(3*s)+"px");out.style.setProperty("--wg",(16*s)+"px");out.style.setProperty("--pb",(14*s)+"px");
 if(!t.value){const p=document.createElement("div");p.className="ph";p.textContent="Your Nova script appears here.";out.appendChild(p);return}
 t.value.split("\n").forEach(l=>{const L=document.createElement("div");L.className="line";
  l.split(" ").forEach(wd=>{if(!wd){const sp=document.createElement("span");sp.style.width=(12*s)+"px";L.appendChild(sp);return}
   const W=document.createElement("span");W.className="word";
   [...wd].forEach(c=>{const k=keyOf(c);if(k)W.appendChild(glyph(k,s));else{const p=document.createElement("span");p.className="p";p.textContent=c;p.style.fontSize=(24*s)+"px";W.appendChild(p)}});
   L.appendChild(W)});
  out.appendChild(L)})}

const add=x=>{t.value+=x;render();t.focus()};
